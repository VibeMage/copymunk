<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Copymunk</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/support/icon.png" type="image/png">
<style>
  /* Cloudflare Pages 在没有 404.html 时会把所有未知路径当成单页应用返回首页（200）。
     有了这个文件，未知路径才会返回真正的 404。 */
  :root { color-scheme: light; --bg: #F4F2ED; --fg: #16161A; --muted: #6E6E76; --link: #0068D6; --card: #FCFBF8; --line: rgba(22, 22, 26, 0.22); }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased; text-align: center;
  }
  main { padding: 24px 20px; }
  img { width: 88px; height: 88px; border-radius: 20px; display: block; margin: 0 auto 20px; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { margin: 4px 0; color: var(--muted); }
  .links { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .links a {
    padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 600;
    color: var(--fg); background: var(--card); border: 1px solid var(--line);
  }
  .links a.primary { background: var(--fg); color: var(--bg); border-color: transparent; }
</style>
</head>
<body>
<main>
  <img src="/support/icon.png" width="88" height="88" alt="">
  <h1>Page not found</h1>
  <p>This chipmunk couldn't find that page.</p>
  <p>没有找到这个页面。</p>
  <div class="links">
    <a class="primary" href="/">Copymunk</a>
    <a href="/support/">Support · 支持</a>
  </div>
</main>
</body>
</html>
