# Asks every outside contributor to sign CLA.md once, by commenting on their pull request.
# Signatures are committed to signatures/cla.json on the unprotected `cla-signatures` branch,
# so main stays clean. That branch has to exist before the first PR arrives.
#
# pull_request_target runs with a write token even for fork PRs, which is safe here only
# because this workflow never checks out or runs the PR's code. Keep it that way.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA check
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/VibeMage/copymunk/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: VibeMage,dependabot[bot],bot*
